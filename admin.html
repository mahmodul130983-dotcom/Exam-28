<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>

  <style>
    :root {
      --bg-base: #030712;
      --card-bg: rgba(17, 24, 39, 0.75);
      --card-border: rgba(255, 255, 255, 0.08);
      --primary: #38bdf8;
      --primary-glow: rgba(56, 189, 248, 0.35);
      --accent: #c084fc;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      
      --correct-text: #34d399;
      --wrong-text: #f87171;
      --skipped-text: #fbbf24;

      --shadow-premium: 0 25px 60px -15px rgba(0, 0, 0, 0.8);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Hind Siliguri', 'Plus Jakarta Sans', sans-serif; }
    
    body {
      background-color: var(--bg-base);
      background-image: 
        radial-gradient(at 0% 0%, rgba(56, 189, 248, 0.12) 0px, transparent 50%),
        radial-gradient(at 100% 0%, rgba(192, 132, 252, 0.12) 0px, transparent 50%),
        radial-gradient(at 50% 100%, rgba(14, 165, 233, 0.08) 0px, transparent 50%);
      color: var(--text-main);
      min-height: 100vh;
      padding: 30px 16px;
      overflow-x: hidden;
    }

    .mesh-bg {
      position: fixed; width: 100vw; height: 100vh; top: 0; left: 0; z-index: -1; overflow: hidden; pointer-events: none;
    }
    .blob {
      position: absolute; border-radius: 50%; filter: blur(100px); opacity: 0.35; animation: moveBlob 15s infinite alternate ease-in-out;
    }
    .blob-1 { width: 400px; height: 400px; background: #0284c7; top: -10%; left: -10%; }
    .blob-2 { width: 450px; height: 450px; background: #7e22ce; bottom: -10%; right: -10%; animation-delay: -7s; }

    @keyframes moveBlob {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(60px, 40px) scale(1.2); }
    }

    .container { max-width: 1100px; margin: 0 auto; }

    /* Header Panel */
    .header-panel {
      background: var(--card-bg);
      backdrop-filter: blur(25px);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 24px 30px;
      margin-bottom: 24px;
      box-shadow: var(--shadow-premium);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
    }
    .badge-tag {
      display: inline-flex; align-items: center; gap: 8px;
      background: rgba(56, 189, 248, 0.1); border: 1px solid rgba(56, 189, 248, 0.3);
      color: #7dd3fc; padding: 6px 16px; border-radius: 100px; font-size: 13px; font-weight: 700;
      text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px;
    }
    .header-panel h1 {
      font-size: 28px; font-weight: 800;
      background: linear-gradient(135deg, #ffffff 20%, #94a3b8 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .header-panel p { color: var(--text-muted); font-size: 14px; }

    /* Analytics Grid */
    .analytics-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 16px; margin-bottom: 24px;
    }
    .stat-card {
      background: var(--card-bg); backdrop-filter: blur(20px); border: 1px solid var(--card-border);
      padding: 20px; border-radius: 20px; box-shadow: var(--shadow-premium);
      display: flex; align-items: center; gap: 16px; transition: transform 0.2s;
    }
    .stat-card:hover { transform: translateY(-3px); }
    .stat-icon {
      width: 52px; height: 52px; border-radius: 16px;
      background: rgba(56, 189, 248, 0.12); border: 1px solid rgba(56, 189, 248, 0.3);
      color: #38bdf8; display: flex; justify-content: center; align-items: center; font-size: 22px;
    }
    .stat-info h3 { font-size: 13px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; }
    .stat-info .value { font-size: 26px; font-weight: 800; color: #ffffff; }

    /* Toolbar Card */
    .toolbar-card {
      background: var(--card-bg); backdrop-filter: blur(20px); border: 1px solid var(--card-border);
      border-radius: 20px; padding: 18px 24px; margin-bottom: 24px;
      display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 16px;
      box-shadow: var(--shadow-premium);
    }
    .search-input-wrapper { position: relative; flex: 1; min-width: 260px; }
    .search-input-wrapper i { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: var(--text-muted); }
    .search-input {
      width: 100%; padding: 12px 16px 12px 46px; font-size: 15px; color: var(--text-main);
      background: rgba(3, 7, 18, 0.6); border: 1.5px solid var(--card-border); border-radius: 14px; outline: none; transition: 0.2s;
    }
    .search-input:focus { border-color: var(--primary); box-shadow: 0 0 20px var(--primary-glow); }

    .toolbar-actions { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .select-all-btn {
      display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; font-weight: 600;
      color: var(--text-muted); padding: 10px 14px; border-radius: 12px;
      background: rgba(255, 255, 255, 0.03); border: 1px solid var(--card-border);
    }
    .btn-delete-bulk {
      background: rgba(239, 68, 68, 0.15); border: 1px solid rgba(239, 68, 68, 0.35); color: #f87171;
      padding: 10px 18px; font-size: 14px; font-weight: 700; border-radius: 12px; cursor: pointer;
      display: flex; align-items: center; gap: 8px; transition: 0.2s;
    }
    .btn-delete-bulk:hover:not(:disabled) { background: rgba(239, 68, 68, 0.3); }
    .btn-delete-bulk:disabled { opacity: 0.35; cursor: not-allowed; }

    /* Result Student Card */
    .result-card {
      background: var(--card-bg); backdrop-filter: blur(20px); border: 1px solid var(--card-border);
      border-radius: 22px; padding: 24px; margin-bottom: 20px; transition: all 0.3s ease; box-shadow: var(--shadow-premium);
    }
    .result-card:hover { border-color: rgba(56, 189, 248, 0.3); }
    .card-top {
      display: flex; justify-content: space-between; align-items: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06); padding-bottom: 14px; margin-bottom: 16px;
    }
    .student-meta { display: flex; align-items: center; gap: 12px; }
    .custom-checkbox { width: 20px; height: 20px; accent-color: var(--primary); cursor: pointer; }
    .student-name { font-size: 20px; font-weight: 700; color: #ffffff; }
    .score-badge {
      background: linear-gradient(135deg, rgba(56, 189, 248, 0.2) 0%, rgba(126, 34, 206, 0.2) 100%);
      border: 1px solid rgba(56, 189, 248, 0.4); color: #7dd3fc; padding: 6px 16px; border-radius: 30px; font-weight: 800; font-size: 16px;
    }

    .stats-row {
      display: flex; gap: 20px; font-size: 14px; background: rgba(3, 7, 18, 0.5);
      padding: 12px 18px; border-radius: 14px; margin-bottom: 18px; flex-wrap: wrap;
    }
    .stats-row span { display: flex; align-items: center; gap: 6px; }

    .wrong-sec-title {
      font-size: 15px; font-weight: 700; color: #f87171; margin-bottom: 12px; display: flex; align-items: center; gap: 8px;
    }
    .wrong-item {
      background: rgba(239, 68, 68, 0.06); border-left: 4px solid #ef4444;
      padding: 12px 16px; border-radius: 12px; margin-bottom: 10px; font-size: 14px; line-height: 1.5;
    }
    .wrong-item strong { display: block; color: #fca5a5; margin-bottom: 6px; }

    .card-actions { display: flex; justify-content: flex-end; margin-top: 14px; }
    .single-delete-btn {
      background: transparent; border: 1px solid rgba(239, 68, 68, 0.3); color: #f87171;
      padding: 8px 16px; font-size: 13px; border-radius: 10px; cursor: pointer; transition: 0.2s;
    }
    .single-delete-btn:hover { background: rgba(239, 68, 68, 0.15); }

    .loader { text-align: center; padding: 50px; font-size: 16px; color: var(--text-muted); }
  </style>
</head>
<body>

  <div class="mesh-bg">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
  </div>

  <div class="container">
    
    <!-- Header -->
    <div class="header-panel">
      <div>
        <div class="badge-tag">
          <i class="fa-solid fa-shield-halved"></i> ELITE ADMIN CONTROL
        </div>
        <h1>Exam Analytics & Results</h1>
        <p>DU B UNIT 28TH EXAM DASHBOARD</p>
      </div>
    </div>

    <!-- Live Statistics Cards -->
    <div class="analytics-grid">
      <div class="stat-card">
        <div class="stat-icon"><i class="fa-solid fa-users"></i></div>
        <div class="stat-info">
          <h3>Total Students</h3>
          <div class="value" id="total-students">0</div>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon" style="color: #34d399; background: rgba(52, 211, 153, 0.15); border-color: rgba(52, 211, 153, 0.3);"><i class="fa-solid fa-trophy"></i></div>
        <div class="stat-info">
          <h3>Highest Score</h3>
          <div class="value" id="top-score">0.00</div>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon" style="color: #c084fc; background: rgba(192, 132, 252, 0.15); border-color: rgba(192, 132, 252, 0.3);"><i class="fa-solid fa-chart-line"></i></div>
        <div class="stat-info">
          <h3>Average Score</h3>
          <div class="value" id="avg-score">0.00</div>
        </div>
      </div>
    </div>

    <!-- Search & Toolbar -->
    <div class="toolbar-card">
      <div class="search-input-wrapper">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" id="search-input" class="search-input" placeholder="Search student name..." onkeyup="filterResults()">
      </div>

      <div class="toolbar-actions">
        <label class="select-all-btn">
          <input type="checkbox" id="select-all-checkbox" onchange="toggleSelectAll(this)">
          Select All
        </label>
        <button class="btn-delete-bulk" id="bulk-delete-btn" onclick="deleteSelectedRecords()" disabled>
          <i class="fa-solid fa-trash-can"></i> Delete Selected (<span id="selected-count">0</span>)
        </button>
      </div>
    </div>

    <!-- Results List Container -->
    <div id="results-container">
      <div class="loader">
        <i class="fa-solid fa-circle-notch fa-spin fa-2x" style="color: var(--primary); margin-bottom: 12px; display: block;"></i>
        Loading student data, please wait...
      </div>
    </div>

  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCTgSqtcDRtvfbIECDFEv_2jAEgModArXc",
      authDomain: "gk-exam-2.firebaseapp.com",
      projectId: "gk-exam-2",
      storageBucket: "gk-exam-2.firebasestorage.app",
      messagingSenderId: "52008698353",
      appId: "1:52008698353:web:08a24e1451711ab72f0450",
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const resultsContainer = document.getElementById('results-container');
    const bulkDeleteBtn = document.getElementById('bulk-delete-btn');
    const selectedCountSpan = document.getElementById('selected-count');

    let allExamData = [];
    let selectedDocIds = new Set();

    function fetchResults() {
      db.collection("quiz_results 28").orderBy("submittedAt", "desc").get()
      .then((querySnapshot) => {
        allExamData = [];
        selectedDocIds.clear();
        updateBulkDeleteButton();

        if (querySnapshot.empty) {
          resultsContainer.innerHTML = '<p style="text-align:center; padding: 50px; color: var(--text-muted);">এখনও কেউ পরীক্ষা দেয়নি বা কোনো রেকর্ড নেই।</p>';
          calculateAnalytics([]);
          return;
        }

        querySnapshot.forEach((doc) => {
          allExamData.push({ id: doc.id, ...doc.data() });
        });

        calculateAnalytics(allExamData);
        renderResults(allExamData);
      })
      .catch((error) => {
        console.error("ডাটা লোড করতে সমস্যা হয়েছে: ", error);
        resultsContainer.innerHTML = '<p style="color:#f87171; text-align:center; padding: 40px;">ডাটা লোড করতে সমস্যা হয়েছে। ফায়ারবেজ কানেকশন চেক করুন।</p>';
      });
    }

    function calculateAnalytics(dataList) {
      const total = dataList.length;
      document.getElementById('total-students').innerText = total;

      if (total === 0) {
        document.getElementById('top-score').innerText = "0.00";
        document.getElementById('avg-score').innerText = "0.00";
        return;
      }

      const scores = dataList.map(item => parseFloat(item.totalScore || item.score) || 0);
      const maxScore = Math.max(...scores);
      const sumScore = scores.reduce((a, b) => a + b, 0);
      const avgScore = (sumScore / total).toFixed(2);

      document.getElementById('top-score').innerText = maxScore.toFixed(2);
      document.getElementById('avg-score').innerText = avgScore;
    }

    function renderResults(dataList) {
      resultsContainer.innerHTML = '';

      if (dataList.length === 0) {
        resultsContainer.innerHTML = '<p style="text-align:center; color: var(--text-muted); padding: 30px;">কোনো ফলাফল পাওয়া যায়নি!</p>';
        return;
      }

      dataList.forEach((data) => {
        let wrongListHTML = '';
        const wrongItems = data.wrongQuestionsBreakdown || data.wrongQuestions || [];

        if (wrongItems.length > 0) {
          wrongItems.forEach((item) => {
            wrongListHTML += `
              <div class="wrong-item">
                <strong>${item.questionText || item.question}</strong>
                <div>Your answer: <span style="color: var(--wrong-text); font-weight:600;">${item.givenAnswer || item.selectedAnswer}</span></div>
                <div>Right Answer: <span style="color: var(--correct-text); font-weight:600;">${item.correctAnswer}</span></div>
              </div>
            `;
          });
        } else {
          wrongListHTML = '<p style="color:var(--correct-text); font-weight:600; margin: 6px 0;"><i class="fa-solid fa-circle-check"></i> চমৎকার! কোনো প্রশ্ন ভুল করেনি (সব সঠিক)</p>';
        }

        const isChecked = selectedDocIds.has(data.id) ? 'checked' : '';
        const studentName = data.studentName || data.name || 'Unknown student';
        const finalScore = data.totalScore || data.score || '০.০০';
        const correctCount = data.correctAnswers !== undefined ? data.correctAnswers : (data.correct || 0);
        const wrongCount = data.wrongAnswers !== undefined ? data.wrongAnswers : (data.wrong || 0);
        const skippedCount = data.skippedQuestions !== undefined ? data.skippedQuestions : (data.skipped || 0);
        
        let displayDate = 'N/A';
        if (data.submittedAt) {
          displayDate = new Date(data.submittedAt).toLocaleString('bn-BD');
        } else if (data.time) {
          displayDate = new Date(data.time.toDate()).toLocaleString('bn-BD');
        }

        const cardHTML = `
          <div class="result-card">
            <div class="card-top">
              <div class="student-meta">
                <input type="checkbox" class="custom-checkbox item-checkbox" value="${data.id}" ${isChecked} onchange="toggleSelectDoc('${data.id}', this.checked)">
                <div class="student-name"><i class="fa-solid fa-user-graduate" style="color:#38bdf8; font-size: 16px; margin-right: 6px;"></i> ${studentName}</div>
              </div>
              <div class="score-badge">স্কোর: ${finalScore}</div>
            </div>

            <div class="stats-row">
              <span><i class="fa-solid fa-circle-check" style="color:var(--correct-text);"></i> Right: <strong>${correctCount}</strong></span>
              <span><i class="fa-solid fa-circle-xmark" style="color:var(--wrong-text);"></i> Wrong: <strong>${wrongCount}</strong></span>
              <span><i class="fa-solid fa-forward" style="color:var(--skipped-text);"></i> Skip: <strong>${skippedCount}</strong></span>
              <span><i class="fa-regular fa-clock" style="color:var(--text-muted);"></i> ${displayDate}</span>
            </div>

            <div class="wrong-sec-title"><i class="fa-solid fa-triangle-exclamation"></i> Wrong Answer Breakdown:</div>
            ${wrongListHTML}

            <div class="card-actions">
              <button class="single-delete-btn" onclick="deleteSingleRecord('${data.id}', '${studentName}')">
                <i class="fa-solid fa-trash"></i> Delete Record
              </button>
            </div>
          </div>
        `;

        resultsContainer.innerHTML += cardHTML;
      });
    }

    function toggleSelectDoc(id, isChecked) {
      if (isChecked) {
        selectedDocIds.add(id);
      } else {
        selectedDocIds.delete(id);
      }
      updateBulkDeleteButton();
    }

    function toggleSelectAll(masterCheckbox) {
      const checkboxes = document.querySelectorAll('.item-checkbox');
      checkboxes.forEach(cb => {
        cb.checked = masterCheckbox.checked;
        if (masterCheckbox.checked) {
          selectedDocIds.add(cb.value);
        } else {
          selectedDocIds.delete(cb.value);
        }
      });
      updateBulkDeleteButton();
    }

    function updateBulkDeleteButton() {
      const count = selectedDocIds.size;
      selectedCountSpan.innerText = count;
      bulkDeleteBtn.disabled = count === 0;
      
      const selectAllCb = document.getElementById('select-all-checkbox');
      const allCheckboxes = document.querySelectorAll('.item-checkbox');
      if (allCheckboxes.length > 0 && count === allCheckboxes.length) {
        selectAllCb.checked = true;
      } else {
        selectAllCb.checked = false;
      }
    }

    function deleteSingleRecord(docId, studentName) {
      if (confirm(`আপনি কি '${studentName}'-এর এই রেজাল্টটি ডিলিট করতে চান?`)) {
        db.collection("quiz_results 28").doc(docId).delete()
        .then(() => {
          fetchResults();
        })
        .catch(err => console.error("ডিলিট করতে সমস্যা হয়েছে: ", err));
      }
    }

    function deleteSelectedRecords() {
      const count = selectedDocIds.size;
      if (count === 0) return;

      if (confirm(`আপনি কি সিলেক্ট করা ${count}টি রেকর্ড ডিলিট করতে চান?`)) {
        const batch = db.batch();
        selectedDocIds.forEach(id => {
          const docRef = db.collection("quiz_results 28").doc(id);
          batch.delete(docRef);
        });

        batch.commit()
        .then(() => {
          alert(`${count}টি রেকর্ড সফলভাবে মুছে ফেলা হয়েছে!`);
          fetchResults();
        })
        .catch(err => console.error("বাল্ক ডিলিট করতে সমস্যা হয়েছে: ", err));
      }
    }

    function filterResults() {
      const query = document.getElementById('search-input').value.toLowerCase().trim();
      const filtered = allExamData.filter(student => {
        const name = (student.studentName || student.name || '').toLowerCase();
        return name.includes(query);
      });
      renderResults(filtered);
    }

    fetchResults();
  </script>
</body>
</html>
